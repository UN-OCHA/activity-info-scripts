[project]
name = "ais"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "typer>=0.24.1",
    "pandas>=3.0.1",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0.1",
    "rich>=14.3.3",
    "mypy>=1.11",
    "jsonpatch",
    "lark",
    "jsonpointer>=3.1.1",
    "client @ file:///${PROJECT_ROOT}/activityinfo",
    "aiohttp-retry>=2.9.1",
]


[dependency-groups]
dev = [
    "cuid2>=2.0.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "testcontainers>=4.14.1",
]

[tool.setuptools]
py-modules = [
    "common",
    "config",
    "db",
    "forms",
    "id_translation",
    "main",
    "server",
    "translations",
    "users",
    "utils",
]

[tool.setuptools.packages.find]
include = ["parser*"]
exclude = ["activityinfo*"]

[tool.mypy]
python_version = "3.11"
files = [
    "main.py",
    "utils.py",
    "db.py",
    "config.py",
    "forms.py",
    "translations.py",
    "users.py",
    "nicktest.py",
    "common.py",
    "id_translation.py",
    "server.py",
    "parser",
]
exclude = ["^build/", "^activityinfo/build/"]
warn_return_any = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["jsonpatch", "jsonpointer"]
ignore_missing_imports = true

# OpenAPI-generated client: many no-any-return findings; check at generation time.
[[tool.mypy.overrides]]
module = ["activityinfo.*", "client.*"]
ignore_errors = true
